# Reusable version-consistency gate.
#
# Callers pin this by full 40-char commit SHA, exactly like malware-scan.yml.
#
# Two checks, both deliberately narrow so they only fire on real mistakes:
#
#   1. DRIFT (always) — if the repo has an Expo app.json, its expo.version must
#      equal package.json version. This is the failure that let storytime-mobile
#      ship 1.3.1 to TestFlight while package.json still said 1.3.0.
#
#   2. TAG REUSE (only when the PR changes the version) — if a PR bumps the
#      version to something that is already tagged, release-tag.yml would find
#      the tag present and silently skip, leaving the release untagged. A PR
#      that does not touch the version is ignored, so ordinary changes are
#      never blocked by this: the base and head manifests are compared by the
#      version VALUE they declare, not by whether the file was edited, so a
#      dependency bump in package.json is not mistaken for a release.
name: version-check

on:
  workflow_call:
    inputs:
      version_files:
        description: >-
          Space-separated paths whose declared version marks a PR as a version
          bump. JSON manifests are compared by value (.version, or Expo's
          .expo.version); any other path falls back to "was it edited at all".
          Defaults cover npm + Expo layouts.
        required: false
        type: string
        default: 'package.json app.json'
      tag_prefix:
        description: 'Prefix used by the release tags (v1.2.3 -> "v").'
        required: false
        type: string
        default: 'v'

permissions:
  contents: read

jobs:
  version-consistency:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so tag lookups and the base-ref diff both work.
          fetch-depth: 0
          persist-credentials: false

      - name: Read declared versions
        id: read
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json at the repo root — nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything is validated INSIDE jq, against the raw JSON, before any
          # value reaches a shell variable. Three separate traps live on this
          # boundary, all verified rather than assumed:
          #
          #   * NUL bytes. Command substitution drops them silently, so a
          #     version carrying one arrives looking pristine.
          #   * Trailing newlines. Also dropped by $( ) — and note that a
          #     ^...$ pattern would not catch them anyway, because Oniguruma
          #     (jq's engine) lets $ match before a final newline. Hence \A/\z.
          #   * Multiple JSON documents. jq reads a stream, so
          #     {"version":"1.2"} {"version":".3"} concatenates to a
          #     perfectly valid "1.2.3" that neither document declares.
          #     `-s` plus `length == 1` requires exactly one document, which
          #     also makes a parse failure a rejection instead of an empty
          #     string.
          SEMVER='\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?\z'
          if ! jq -s -e --arg re "$SEMVER" \
                'length == 1 and ((.[0].version // "") | test($re))' \
                package.json >/dev/null 2>&1; then
            # tojson, not the raw value: this branch exists to report a
            # manifest we have just judged malformed, so the value is exactly
            # the untrusted input. CR and LF survive `tr -d '\000'`, and a
            # newline inside an ::error annotation starts a NEW workflow
            # command — a version of "1.2\n::add-mask::x" would run as one.
            # tojson renders it as a single escaped JSON string.
            FOUND=$(jq -s -r 'if length == 1 then ((.[0].version // "<missing>") | tojson) else "<\(length) JSON documents>" end' package.json 2>/dev/null | tr -d '\000' | head -c 60 || true)
            echo "::error file=package.json::version is missing, malformed, or not valid SemVer 2.0.0 (saw: ${FOUND:-<unparseable>})."
            exit 1
          fi

          # Safe by construction now: anything that passed the check above is a
          # single-line SemVer string drawn from [0-9A-Za-z.+-].
          PKG=$(jq -r '.version' package.json)
          {
            echo "skip=false"
            echo "pkg=$PKG"
          } >> "$GITHUB_OUTPUT"
          echo "package.json version: $PKG"

      - name: Check app.json agrees with package.json
        if: steps.read.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app.json ]; then
            echo "No app.json — drift check not applicable."
            exit 0
          fi

          # Compare the two raw JSON values inside jq rather than as shell
          # strings. Comparing after $( ) would let "1.3.1" and "1.3.1\n" look
          # identical, which is precisely the drift this job exists to catch.
          STATUS=$(jq -n -r --slurpfile a app.json --slurpfile p package.json '
            if ($a | length) != 1 then "bad-app-json"
            elif (($a[0].expo.version? // null) == null) then "no-app-version"
            elif ($a[0].expo.version) == ($p[0].version) then "match"
            else "drift"
            end' 2>/dev/null) || STATUS="bad-app-json"

          case "$STATUS" in
            bad-app-json)
              echo "::error file=app.json::app.json is not a single parseable JSON document."
              exit 1
              ;;
            no-app-version)
              echo "app.json has no expo.version — nothing to compare."
              ;;
            match)
              echo "app.json and package.json agree on $(jq -r '.version' package.json)."
              ;;
            drift)
              APP=$(jq -r '.expo.version | tojson' app.json | tr -d '\000' | head -c 60)
              PKG=$(jq -r '.version | tojson' package.json | tr -d '\000' | head -c 60)
              echo "::error file=app.json::Version drift: app.json expo.version is ${APP} but package.json is ${PKG}. Expo builds take the version from app.json, while release tagging reads package.json — leaving these apart produces a released binary that no tag describes. Set both to the same value."
              exit 1
              ;;
          esac

      - name: Check the version is not already tagged
        # Only meaningful on a PR, and only when the PR actually moves the version.
        if: steps.read.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          PKG: ${{ steps.read.outputs.pkg }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION_FILES: ${{ inputs.version_files }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          # The question this gate has to answer is "did the PR move the
          # VERSION", not "did it touch a file that happens to carry one".
          # Diffing the paths answered the second question, so adding a
          # dependency or editing a script in package.json was classified as a
          # release and then failed on the tag the unchanged version already
          # owns. Compare the declared values instead.
          #
          # Per configured path:
          #   * readable as a single JSON document on BOTH sides — compare the
          #     declared version (.version, or Expo's .expo.version) inside jq,
          #     never as shell strings. $( ) drops NUL bytes and trailing
          #     newlines, which is exactly how two different values come to
          #     look equal; the drift check above avoids that the same way.
          #   * present on one side only — the file was added or deleted. A
          #     deletion still counts as moving the version, as before: the
          #     declared value went from something to nothing.
          #   * anything not readable as JSON on both sides — a non-JSON
          #     manifest a caller configured, a pathspec/glob, a malformed or
          #     multi-document file — falls back to the old "did this path
          #     change at all" diff. That is the conservative direction: the
          #     fallback can only make the gate run, never make it skip.
          BASE_BLOB=$(mktemp)
          trap 'rm -f "$BASE_BLOB"' EXIT

          FILES=()
          read -r -a FILES <<< "$VERSION_FILES"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::warning::version_files is empty, so there is nothing to compare — the tag-reuse check cannot run. Configure at least one manifest path."
            exit 0
          fi

          MOVED=0
          for f in ${FILES[@]+"${FILES[@]}"}; do
            BASE_PRESENT=0
            if git cat-file blob "$BASE_SHA:$f" > "$BASE_BLOB" 2>/dev/null; then
              BASE_PRESENT=1
            fi
            HEAD_PRESENT=0
            if [ -f "$f" ]; then
              HEAD_PRESENT=1
            fi

            REASON="not comparable as JSON"
            if [ "$BASE_PRESENT" = 1 ] && [ "$HEAD_PRESENT" = 1 ]; then
              # "bad" cannot collide with a real value: tojson of the string
              # bad is "\"bad\"", quotes included.
              VERDICT=$(jq -n -r --slurpfile b "$BASE_BLOB" --slurpfile h "$f" '
                def declared:
                  if length != 1 then "bad"
                  else ((.[0] | (.version? // (.expo? | .version?) // null)) | tojson)
                  end;
                ($b | declared) as $bv | ($h | declared) as $hv |
                if $bv == "bad" or $hv == "bad" then "unknown"
                elif $bv == $hv then "same"
                else "moved"
                end' 2>/dev/null) || VERDICT="unknown"
            elif [ "$BASE_PRESENT" != "$HEAD_PRESENT" ]; then
              echo "$f: added or deleted by this PR — the declared version moved to or from nothing."
              MOVED=1
              continue
            else
              # Absent from both sides as a literal file. It may still be a
              # pathspec that matches something, so let git answer.
              REASON="no such file on either side"
              VERDICT="unknown"
            fi

            case "$VERDICT" in
              same)
                echo "$f: declared version unchanged from base."
                ;;
              moved)
                echo "$f: declared version changed between base and head."
                MOVED=1
                ;;
              unknown)
                if git diff --quiet "$BASE_SHA" -- "$f"; then
                  echo "$f: unchanged ($REASON; fell back to a file diff)."
                else
                  echo "$f: changed ($REASON; fell back to a file diff)."
                  MOVED=1
                fi
                ;;
            esac
          done

          if [ "$MOVED" = 0 ]; then
            echo "This PR leaves the version declared in $VERSION_FILES unchanged — not a version bump, skipping tag check."
            exit 0
          fi
          TAG="${TAG_PREFIX}${PKG}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING=$(git rev-list -n 1 "$TAG")
            echo "::error::This PR sets the version to $PKG, but tag $TAG already exists (at ${EXISTING:0:8}). release-tag.yml skips when the tag is present, so merging this would leave the release untagged. Bump to an unreleased version instead."
            exit 1
          fi
          echo "Version $PKG is not yet tagged as $TAG — good."
