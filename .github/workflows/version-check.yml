# Reusable version-consistency gate.
#
# Callers pin this by full 40-char commit SHA, exactly like malware-scan.yml.
#
# Two checks, both deliberately narrow so they only fire on real mistakes:
#
#   1. DRIFT (always) — if the repo has an Expo app.json, its expo.version must
#      equal package.json version. This is the failure that let storytime-mobile
#      ship 1.3.1 to TestFlight while package.json still said 1.3.0.
#
#   2. TAG REUSE (only when the PR changes the version) — if a PR bumps the
#      version to something that is already tagged, release-tag.yml would find
#      the tag present and silently skip, leaving the release untagged. A PR
#      that leaves the declared version alone is ignored, so ordinary changes
#      are never blocked by this: base and head are compared by the version
#      VALUE each manifest declares, not by whether the file was edited, so a
#      dependency bump in package.json is not mistaken for a release.
name: version-check

on:
  workflow_call:
    inputs:
      version_files:
        description: >-
          Space-separated paths whose declared version marks a PR as a version
          bump. Each is compared between base and head by the version it
          declares (.version, or Expo's .expo.version); a path that declares
          neither is not a version signal. Globs are matched by git, not the
          shell. Defaults cover npm + Expo layouts.
        required: false
        type: string
        default: 'package.json app.json'
      tag_prefix:
        description: 'Prefix used by the release tags (v1.2.3 -> "v").'
        required: false
        type: string
        default: 'v'

permissions:
  contents: read

jobs:
  version-consistency:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so tag lookups and the base-ref diff both work.
          fetch-depth: 0
          persist-credentials: false

      - name: Read declared versions
        id: read
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json at the repo root — nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything is validated INSIDE jq, against the raw JSON, before any
          # value reaches a shell variable. Three separate traps live on this
          # boundary, all verified rather than assumed:
          #
          #   * NUL bytes. Command substitution drops them silently, so a
          #     version carrying one arrives looking pristine.
          #   * Trailing newlines. Also dropped by $( ) — and note that a
          #     ^...$ pattern would not catch them anyway, because Oniguruma
          #     (jq's engine) lets $ match before a final newline. Hence \A/\z.
          #   * Multiple JSON documents. jq reads a stream, so
          #     {"version":"1.2"} {"version":".3"} concatenates to a
          #     perfectly valid "1.2.3" that neither document declares.
          #     `-s` plus `length == 1` requires exactly one document, which
          #     also makes a parse failure a rejection instead of an empty
          #     string.
          SEMVER='\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?\z'
          if ! jq -s -e --arg re "$SEMVER" \
                'length == 1 and ((.[0].version // "") | test($re))' \
                package.json >/dev/null 2>&1; then
            # tojson, not the raw value: this branch exists to report a
            # manifest we have just judged malformed, so the value is exactly
            # the untrusted input. CR and LF survive `tr -d '\000'`, and a
            # newline inside an ::error annotation starts a NEW workflow
            # command — a version of "1.2\n::add-mask::x" would run as one.
            # tojson renders it as a single escaped JSON string.
            FOUND=$(jq -s -r 'if length == 1 then ((.[0].version // "<missing>") | tojson) else "<\(length) JSON documents>" end' package.json 2>/dev/null | tr -d '\000' | head -c 60 || true)
            echo "::error file=package.json::version is missing, malformed, or not valid SemVer 2.0.0 (saw: ${FOUND:-<unparseable>})."
            exit 1
          fi

          # Safe by construction now: anything that passed the check above is a
          # single-line SemVer string drawn from [0-9A-Za-z.+-].
          PKG=$(jq -r '.version' package.json)
          {
            echo "skip=false"
            echo "pkg=$PKG"
          } >> "$GITHUB_OUTPUT"
          echo "package.json version: $PKG"

      - name: Check app.json agrees with package.json
        if: steps.read.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app.json ]; then
            echo "No app.json — drift check not applicable."
            exit 0
          fi

          # Compare the two raw JSON values inside jq rather than as shell
          # strings. Comparing after $( ) would let "1.3.1" and "1.3.1\n" look
          # identical, which is precisely the drift this job exists to catch.
          STATUS=$(jq -n -r --slurpfile a app.json --slurpfile p package.json '
            if ($a | length) != 1 then "bad-app-json"
            elif (($a[0].expo.version? // null) == null) then "no-app-version"
            elif ($a[0].expo.version) == ($p[0].version) then "match"
            else "drift"
            end' 2>/dev/null) || STATUS="bad-app-json"

          case "$STATUS" in
            bad-app-json)
              echo "::error file=app.json::app.json is not a single parseable JSON document."
              exit 1
              ;;
            no-app-version)
              echo "app.json has no expo.version — nothing to compare."
              ;;
            match)
              echo "app.json and package.json agree on $(jq -r '.version' package.json)."
              ;;
            drift)
              APP=$(jq -r '.expo.version | tojson' app.json | tr -d '\000' | head -c 60)
              PKG=$(jq -r '.version | tojson' package.json | tr -d '\000' | head -c 60)
              echo "::error file=app.json::Version drift: app.json expo.version is ${APP} but package.json is ${PKG}. Expo builds take the version from app.json, while release tagging reads package.json — leaving these apart produces a released binary that no tag describes. Set both to the same value."
              exit 1
              ;;
          esac

      - name: Check the version is not already tagged
        # Only meaningful on a PR, and only when the PR actually moves the version.
        if: steps.read.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          PKG: ${{ steps.read.outputs.pkg }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION_FILES: ${{ inputs.version_files }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          # The question this gate has to answer is "did the PR move the
          # VERSION", not "did it touch a file that happens to carry one".
          # Diffing the paths answered the second question, so adding a
          # dependency or editing a script in package.json was classified as a
          # release and then failed on the tag the unchanged version already
          # owns.
          #
          # Note what the error below actually asserts: "this PR sets the
          # version to $PKG". If the declared version matches the base
          # branch's, that sentence is false however many files moved — the tag
          # was claimed by a commit this PR did not write. So the trigger is a
          # change to the version VALUE: git lists the files the PR changed
          # under each configured pathspec, and each is compared to its base
          # revision by the version it declares.
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          BASE_BLOB="$WORK/base.blob"
          HEAD_BLOB="$WORK/head.blob"
          BASE_DECL="$WORK/base.decl"
          HEAD_DECL="$WORK/head.decl"
          CHANGED="$WORK/changed"

          # What a file declares, reduced to one line of JSON.
          #
          # BOTH keys are kept rather than letting .version win, so an app.json
          # carrying an unrelated top-level "version" cannot hide a bump to
          # expo.version. The cost is the mirror image: editing an unrelated
          # "expo" block inside package.json reads as a version move. Blocking
          # a rare PR is the better failure of the two.
          #
          # Absent, malformed, multi-document, and "valid JSON with no version
          # key" all have to reduce to the SAME value, or the transitions
          # between them (adding a version-less app.json, repairing a broken
          # one) look like version moves and block the PR.
          declared_versions() {
            if jq -s -r '
                  if length != 1 then [null, null]
                  else [(.[0].version? // null), (.[0].expo?.version? // null)]
                  end | tojson' "$1" > "$2" 2>/dev/null; then
              return 0
            fi
            # jq refused the input. Malformed JSON declaring nothing is the
            # expected case — but a jq that cannot run would land here too, and
            # that must not quietly turn the gate off, so make it prove itself.
            if ! jq -n -e 'true' >/dev/null 2>&1; then
              echo "::error::jq cannot run on this runner, so no version could be read. Failing rather than passing the check silently."
              exit 1
            fi
            printf '[null,null]\n' > "$2"
          }

          # actions/checkout leaves HEAD at the PR's merge commit, whose first
          # parent is the base branch as it stands NOW. Diff against that
          # instead of the base.sha minted into the event payload, or a release
          # someone else merges into the base while this PR sits open gets
          # attributed to this PR. Fall back to the payload SHA when HEAD is
          # not a merge commit.
          if git rev-parse -q --verify 'HEAD^2' >/dev/null 2>&1; then
            DIFF_BASE=$(git rev-parse 'HEAD^1')
            echo "Comparing against the base branch at $DIFF_BASE (first parent of the merge commit)."
          else
            DIFF_BASE="$BASE_SHA"
            echo "HEAD is not a merge commit; comparing against the event's base SHA $DIFF_BASE."
          fi

          # Split on whitespace the way the old unquoted `git diff --
          # $VERSION_FILES` did — including newlines, so a caller writing the
          # list as a YAML block scalar keeps every path — but with pathname
          # expansion OFF. bash would only expand a glob against the checked
          # out head, which hides a file the PR deleted; passing the pattern
          # through to git matches it against both revisions instead.
          set -f
          # shellcheck disable=SC2206
          FILES=($VERSION_FILES)
          set +f

          if [ "${#FILES[@]}" -eq 0 ]; then
            # package.json is the file the tag is built from, so it is the one
            # path that always has to be consulted.
            echo "version_files is empty; comparing package.json only."
            FILES=(package.json)
          fi

          MOVED=0
          MATCHED_ANY=0
          for tok in "${FILES[@]}"; do
            # git ls-files, NOT ls-tree: ls-tree ignores glob pathspecs
            # outright (`ls-tree -r HEAD -- 'pkgs/*/package.json'` matches
            # nothing), which would report a working config as inert. A path
            # that only existed at the base is picked up below, from the diff.
            if [ -n "$(git ls-files -- "$tok" 2>/dev/null)" ]; then
              MATCHED_ANY=1
            fi

            # Two commits, not commit-vs-worktree: every read below comes from
            # git, so an untracked or ignored file cannot look like one this PR
            # added. --no-renames keeps a rename visible as a delete plus an
            # add rather than collapsing to the destination path alone.
            if ! git diff --no-renames --name-only -z "$DIFF_BASE" HEAD -- "$tok" > "$CHANGED" 2>/dev/null; then
              # Only a bad revision or malformed pathspec magic gets here; a
              # path that simply matches nothing is not an error to git.
              echo "::warning::version_files entry '$tok' could not be diffed; treating it as a version change."
              MOVED=1
              continue
            fi
            if [ ! -s "$CHANGED" ]; then
              echo "version_files entry '$tok': no file under this path changed."
              continue
            fi
            MATCHED_ANY=1

            while IFS= read -r -d '' f; do
              # A path is attacker-controlled — a PR can add a file whose name
              # contains a newline, or starts with "::" — and a log line that
              # begins with one becomes a GitHub workflow command. Strip the
              # control characters, and never start the line with the path.
              SAFE=$(printf '%s' "$f" | tr -d '\000-\037' | head -c 200)

              git cat-file blob "$DIFF_BASE:$f" > "$BASE_BLOB" 2>/dev/null || : > "$BASE_BLOB"
              git cat-file blob "HEAD:$f" > "$HEAD_BLOB" 2>/dev/null || : > "$HEAD_BLOB"
              declared_versions "$BASE_BLOB" "$BASE_DECL"
              declared_versions "$HEAD_BLOB" "$HEAD_DECL"

              # cmp, not a shell string comparison: $( ) drops NUL bytes and
              # trailing newlines, which is exactly how two different versions
              # come to look equal. The drift check above guards the same
              # boundary the same way.
              if cmp -s "$BASE_DECL" "$HEAD_DECL"; then
                echo "version file $SAFE: changed, but declares the same version as the base."
              else
                # Covers a deletion as well as an edit: a version file the PR
                # removes goes from declaring something to declaring nothing,
                # which stays a version move, as it was before.
                echo "version file $SAFE: the declared version changed between base and head."
                MOVED=1
              fi
            done < "$CHANGED"
          done

          if [ "$MATCHED_ANY" = 0 ]; then
            echo "::warning::None of the configured version_files (${FILES[*]}) exists at either revision, so this check can never fire. Fix the configured paths if that is not intended."
          fi

          if [ "$MOVED" = 0 ]; then
            echo "This PR leaves the version declared in ${FILES[*]} unchanged — not a version bump, skipping tag check."
            exit 0
          fi
          TAG="${TAG_PREFIX}${PKG}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING=$(git rev-list -n 1 "refs/tags/$TAG")
            echo "::error::This PR sets the version to $PKG, but tag $TAG already exists (at ${EXISTING:0:8}). release-tag.yml skips when the tag is present, so merging this would leave the release untagged. Bump to an unreleased version instead."
            exit 1
          fi
          echo "Version $PKG is not yet tagged as $TAG — good."
