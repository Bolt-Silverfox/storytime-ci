# Reusable version-consistency gate.
#
# Callers pin this by full 40-char commit SHA, exactly like malware-scan.yml.
#
# Two checks, both deliberately narrow so they only fire on real mistakes:
#
#   1. DRIFT (always) — if the repo has an Expo app.json, its expo.version must
#      equal package.json version. This is the failure that let storytime-mobile
#      ship 1.3.1 to TestFlight while package.json still said 1.3.0.
#
#   2. TAG REUSE (only when the PR changes the version) — if a PR bumps the
#      version to something that is already tagged, release-tag.yml would find
#      the tag present and silently skip, leaving the release untagged. A PR
#      that does not touch the version is ignored, so ordinary changes are
#      never blocked by this.
name: version-check

on:
  workflow_call:
    inputs:
      version_files:
        description: >-
          Space-separated paths whose change marks a PR as a version bump.
          Defaults cover npm + Expo layouts.
        required: false
        type: string
        default: 'package.json app.json'
      tag_prefix:
        description: 'Prefix used by the release tags (v1.2.3 -> "v").'
        required: false
        type: string
        default: 'v'

permissions:
  contents: read

jobs:
  version-consistency:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so tag lookups and the base-ref diff both work.
          fetch-depth: 0
          persist-credentials: false

      - name: Read declared versions
        id: read
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json at the repo root — nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything is validated INSIDE jq, against the raw JSON, before any
          # value reaches a shell variable. Three separate traps live on this
          # boundary, all verified rather than assumed:
          #
          #   * NUL bytes. Command substitution drops them silently, so a
          #     version carrying one arrives looking pristine.
          #   * Trailing newlines. Also dropped by $( ) — and note that a
          #     ^...$ pattern would not catch them anyway, because Oniguruma
          #     (jq's engine) lets $ match before a final newline. Hence \A/\z.
          #   * Multiple JSON documents. jq reads a stream, so
          #     {"version":"1.2"} {"version":".3"} concatenates to a
          #     perfectly valid "1.2.3" that neither document declares.
          #     `-s` plus `length == 1` requires exactly one document, which
          #     also makes a parse failure a rejection instead of an empty
          #     string.
          SEMVER='\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?\z'
          if ! jq -s -e --arg re "$SEMVER" \
                'length == 1 and ((.[0].version // "") | test($re))' \
                package.json >/dev/null 2>&1; then
            FOUND=$(jq -s -r 'if length == 1 then (.[0].version // "<missing>") else "<\(length) JSON documents>" end' package.json 2>/dev/null | tr -d '\000' | head -c 60 || true)
            echo "::error file=package.json::version is missing, malformed, or not valid SemVer 2.0.0 (saw: ${FOUND:-<unparseable>})."
            exit 1
          fi

          # Safe by construction now: anything that passed the check above is a
          # single-line SemVer string drawn from [0-9A-Za-z.+-].
          PKG=$(jq -r '.version' package.json)
          {
            echo "skip=false"
            echo "pkg=$PKG"
          } >> "$GITHUB_OUTPUT"
          echo "package.json version: $PKG"

      - name: Check app.json agrees with package.json
        if: steps.read.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app.json ]; then
            echo "No app.json — drift check not applicable."
            exit 0
          fi

          # Compare the two raw JSON values inside jq rather than as shell
          # strings. Comparing after $( ) would let "1.3.1" and "1.3.1\n" look
          # identical, which is precisely the drift this job exists to catch.
          STATUS=$(jq -n -r --slurpfile a app.json --slurpfile p package.json '
            if ($a | length) != 1 then "bad-app-json"
            elif (($a[0].expo.version? // null) == null) then "no-app-version"
            elif ($a[0].expo.version) == ($p[0].version) then "match"
            else "drift"
            end' 2>/dev/null) || STATUS="bad-app-json"

          case "$STATUS" in
            bad-app-json)
              echo "::error file=app.json::app.json is not a single parseable JSON document."
              exit 1
              ;;
            no-app-version)
              echo "app.json has no expo.version — nothing to compare."
              ;;
            match)
              echo "app.json and package.json agree on $(jq -r '.version' package.json)."
              ;;
            drift)
              APP=$(jq -r '.expo.version | tojson' app.json | tr -d '\000' | head -c 60)
              PKG=$(jq -r '.version | tojson' package.json | tr -d '\000' | head -c 60)
              echo "::error file=app.json::Version drift: app.json expo.version is ${APP} but package.json is ${PKG}. Expo builds take the version from app.json, while release tagging reads package.json — leaving these apart produces a released binary that no tag describes. Set both to the same value."
              exit 1
              ;;
          esac

      - name: Check the version is not already tagged
        # Only meaningful on a PR, and only when the PR actually moves the version.
        if: steps.read.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          PKG: ${{ steps.read.outputs.pkg }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION_FILES: ${{ inputs.version_files }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          # Pass every configured path straight to git rather than filtering by
          # what exists in the working tree: a path missing on one side is
          # exactly what a deletion looks like, and that still counts as a
          # change to a version file. git ignores paths absent from both sides.
          # shellcheck disable=SC2086
          if git diff --quiet "$BASE_SHA" -- $VERSION_FILES; then
            echo "This PR does not touch $VERSION_FILES — not a version bump, skipping tag check."
            exit 0
          fi
          TAG="${TAG_PREFIX}${PKG}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING=$(git rev-list -n 1 "$TAG")
            echo "::error::This PR sets the version to $PKG, but tag $TAG already exists (at ${EXISTING:0:8}). release-tag.yml skips when the tag is present, so merging this would leave the release untagged. Bump to an unreleased version instead."
            exit 1
          fi
          echo "Version $PKG is not yet tagged as $TAG — good."
